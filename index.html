<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a12">
<title>AUREX — ARX</title>
<style>
:root{--gold:#e8c66b;--gold2:#fff0b4;--green:#19d58a;--deep:#04130e;--panel:rgba(7,30,21,.72)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8f4df}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 42%,rgba(24,119,75,.48),transparent 42%),radial-gradient(ellipse at 15% 18%,rgba(196,151,54,.19),transparent 32%),radial-gradient(ellipse at 85% 72%,rgba(18,112,72,.3),transparent 38%),linear-gradient(145deg,#06180f,#09281b 48%,#020b08);position:relative}
body:before,body:after{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0}
body:before{background:radial-gradient(ellipse,rgba(238,190,83,.16),transparent 58%);filter:blur(34px);animation:fog 14s ease-in-out infinite alternate}
body:after{opacity:.5;background-image:radial-gradient(1px 1px at 12% 21%,#fff 99%,transparent),radial-gradient(2px 2px at 72% 15%,#ffe8a0 99%,transparent),radial-gradient(1px 1px at 39% 72%,#fff 99%,transparent),radial-gradient(1px 1px at 88% 61%,#fff 99%,transparent),radial-gradient(2px 2px at 24% 84%,#f6d77a 99%,transparent);background-size:260px 220px;animation:twinkle 5s ease-in-out infinite alternate}
@keyframes fog{to{transform:translate(5%,3%) scale(1.12);opacity:.65}}@keyframes twinkle{to{opacity:.9;filter:brightness(1.8)}}
.meteor{position:fixed;width:100px;height:2px;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,#ffe6a0,transparent);transform:rotate(-35deg);opacity:0;animation:shoot 8s linear infinite}
.m1{top:12%;left:-15%;animation-delay:1s}.m2{top:44%;left:-20%;animation-delay:5s}.m3{top:72%;left:-15%;animation-delay:9s}
@keyframes shoot{0%,75%{opacity:0;transform:translate(0,0) rotate(-35deg)}78%{opacity:.9}100%{opacity:0;transform:translate(125vw,65vh) rotate(-35deg)}}
.app{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 24px}
.brand{font-weight:900;letter-spacing:3px;color:var(--gold2);font-size:21px;text-shadow:0 0 18px #b98a35}
.pill{border:1px solid rgba(232,198,107,.35);background:rgba(3,20,13,.55);border-radius:30px;padding:8px 13px;color:#f3dfa0;font-size:12px}
.balance{text-align:center;background:linear-gradient(120deg,rgba(4,26,17,.6),rgba(30,69,43,.34));border:1px solid rgba(232,198,107,.22);border-radius:22px;padding:16px 12px;box-shadow:0 10px 35px #0004,inset 0 0 25px #d9ad3b0b}
.caption{font-size:12px;color:#c8c4a8}.amount{font-size:30px;font-weight:800;color:#fff0b4;margin-top:4px;text-shadow:0 0 20px #d6ad52}
.coin-wrap{display:flex;justify-content:center;align-items:center;margin:30px auto 24px;perspective:900px}
.coin{width:224px;height:224px;border-radius:50%;position:relative;display:grid;place-items:center;cursor:pointer;border:0;color:inherit;background:radial-gradient(circle at 36% 28%,#fff4bd 0 2%,#d5b65f 5%,#7d5b20 11%,#102b1d 18%,#07150f 53%,#b68a32 62%,#f6df8c 67%,#4b3515 72%,#07140e 78%);box-shadow:0 22px 28px #0009,0 0 0 7px #9b762e,0 0 0 11px #e6c86d,0 0 35px #d5a63d88,inset 0 0 18px #fff5b0;transform:rotateX(8deg);transition:transform .12s,filter .12s}
.coin:before{content:"";position:absolute;inset:14px;border-radius:50%;border:3px solid #d9b85d;box-shadow:inset 0 0 0 3px #1a3a27,inset 0 0 25px #d9a83b55,0 0 16px #d6b25288}
.coin:after{content:"";position:absolute;inset:27px;border-radius:50%;border:1px solid #a98a43;box-shadow:inset 0 0 20px #17d58a33}
.coin:active{transform:rotateX(8deg) scale(.94);filter:brightness(1.25)}
.coin-inner{position:relative;z-index:2;text-align:center;width:100%;padding-top:2px;text-shadow:0 2px 5px #000,0 0 14px #f0ca65}
.coin-name{font-size:21px;letter-spacing:3px;font-weight:1000;color:#ffe9a0}
.coin-symbol{font-size:12px;letter-spacing:5px;color:#e6c96e;margin-top:4px}
.triangle{width:70px;height:64px;margin:8px auto 2px;filter:drop-shadow(0 0 10px #20e49b)}
.triangle svg{width:100%;height:100%}
.tap-hint{text-align:center;color:#e8d89e;font-size:13px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.stat{background:var(--panel);border:1px solid rgba(232,198,107,.2);border-radius:17px;padding:13px;text-align:center;backdrop-filter:blur(8px)}
.stat strong{display:block;font-size:19px;color:#f7dfa0;margin-top:4px}
.energy{margin-top:16px;background:var(--panel);border:1px solid rgba(232,198,107,.18);border-radius:18px;padding:14px}
.energy-top{display:flex;justify-content:space-between;font-size:13px;color:#e9ddb2;margin-bottom:10px}
.track{height:9px;border-radius:20px;background:#152a20;overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#0c9d65,#b9e57d,#f2d27b);box-shadow:0 0 12px #eac96a;transition:width .2s}
.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(3,16,11,.9);border-top:1px solid #c7a44b55;backdrop-filter:blur(18px)}
.nav button{border:0;background:transparent;color:#a9b9a8;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;font-size:10px}
.nav button.active{color:#ffe39a;text-shadow:0 0 12px #d8ad4c}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notice{text-align:center;color:#8ea08d;font-size:10px;margin-top:12px}
@media(max-width:360px){.coin{width:195px;height:195px}.app{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div class="meteor m1"></div><div class="meteor m2"></div><div class="meteor m3"></div>
<main class="app">
<header><div class="brand">AUREX <span style="color:#18d58a">◆</span></div><div class="pill">ARX · SPACE NETWORK</div></header>
<section class="balance"><div class="caption">إجمالي رصيدك</div><div class="amount" id="balance">0.00 <small style="font-size:14px">ARX</small></div></section>
<div class="coin-wrap"><button class="coin" id="tap" aria-label="اضغط لجمع ARX"><div class="coin-inner"><div class="coin-name">AUREX</div><div class="triangle"><svg viewBox="0 0 100 90" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9e6a0"/><stop offset=".5" stop-color="#20dc91"/><stop offset="1" stop-color="#08794e"/></linearGradient></defs><path d="M50 5 94 82H6Z" fill="url(#g)" stroke="#f5d77b" stroke-width="4"/><path d="M50 25 73 68H27Z" fill="#09251a" opacity=".85"/></svg></div><div class="coin-symbol">ARX</div></div></button></div>
<div class="tap-hint">اضغط على عملة AUREX لجمع المكافآت</div>
<section class="stats"><div class="stat"><span class="caption">الطاقة المتبقية</span><strong id="energyText">1000 / 1000</strong></div><div class="stat"><span class="caption">قيمة الضغطة</span><strong>0.01 ARX</strong></div></section>
<section class="energy"><div class="energy-top"><span>⚡ الطاقة</span><span>تتجدد كل 12 ساعة</span></div><div class="track"><div class="fill" id="energyFill"></div></div></section>
<div class="notice">واجهة أولية للعرض — حفظ الرصيد وربط قاعدة البيانات سيضاف لاحقاً</div>
</main>
<nav class="nav" aria-label="التنقل">
<button><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"/></svg><span>حسابي</span></button>
<button><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3 2.4-4.5 6-4.5M16 5a3 3 0 0 1 0 6m1 4c2.5.4 3.8 2 4 5M14 16c3.5 0 5.5 1.3 6 4"/></svg><span>دعوة</span></button>
<button class="active"><svg viewBox="0 0 24 24"><path d="M12 3 21 20H3Z"/><path d="m12 9 4 8H8Z"/></svg><span>الرئيسية</span></button>
<button><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><span>ترتيب</span></button>
<button><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-13 5h4"/></svg><span>محفظة</span></button>
</nav>
<script>
let balance=0,energy=1000;
const balanceEl=document.getElementById('balance'),energyEl=document.getElementById('energyText'),fill=document.getElementById('energyFill');
document.getElementById('tap').addEventListener('click',()=>{if(energy<=0)return;energy--;balance=Math.round((balance+0.01)*100)/100;balanceEl.innerHTML=balance.toFixed(2)+' <small style="font-size:14px">ARX</small>';energyEl.textContent=energy+' / 1000';fill.style.width=(energy/10)+'%'});
</script>
</body></html>
