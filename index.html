<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03130f">
<title>AUREX — ARX</title>
<style>
:root{--gold:#f1cb69;--gold-light:#fff0ae;--green:#16e49a;--deep:#03130e;--panel:rgba(5,27,19,.78)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8f4df}
body{min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 43%,#07553a 0,#052b20 28%,#03140f 62%,#010706 100%)}
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body:before{opacity:.65;background-image:radial-gradient(1px 1px at 12% 21%,#fff 99%,transparent),radial-gradient(2px 2px at 72% 15%,#ffe8a0 99%,transparent),radial-gradient(1px 1px at 39% 72%,#fff 99%,transparent),radial-gradient(1px 1px at 88% 61%,#fff 99%,transparent),radial-gradient(2px 2px at 24% 84%,#50ffc1 99%,transparent);background-size:260px 220px;animation:twinkle 5s ease-in-out infinite alternate}
body:after{background:radial-gradient(ellipse at 50% 100%,#00e99b22,transparent 48%),linear-gradient(180deg,#01080630,transparent 35%,#01080655)}
@keyframes twinkle{to{opacity:1;filter:brightness(1.8)}}
.space-photo{position:fixed;inset:10px;z-index:0;pointer-events:none;background-image:url("./file_000000008020821094d5937ef2acc5af.png");background-size:cover;background-position:center;background-repeat:no-repeat;filter:none}
.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.30;background-image:radial-gradient(2px 2px at 12% 18%,#ffe58a 99%,transparent),radial-gradient(2px 2px at 27% 67%,#54ffad 99%,transparent),radial-gradient(1.5px 1.5px at 43% 31%,#ffe58a 99%,transparent),radial-gradient(2px 2px at 61% 79%,#50ffb0 99%,transparent),radial-gradient(1.5px 1.5px at 78% 24%,#ffe58a 99%,transparent),radial-gradient(2px 2px at 91% 58%,#50ffb0 99%,transparent);background-size:100% 100%;animation:sparkleBlink 4.8s ease-in-out infinite alternate}@keyframes sparkleBlink{0%{opacity:.08;filter:brightness(.8)}45%{opacity:.30;filter:brightness(1.5)}100%{opacity:.12;filter:brightness(1)}}
.space-planet{display:none;position:fixed;z-index:0;pointer-events:none;border-radius:50%;box-shadow:inset -22px -16px 38px #000b,0 0 34px #27d9a044}
.planet-a{width:clamp(105px,24vw,230px);height:clamp(105px,24vw,230px);right:-7%;top:9%;background:radial-gradient(circle at 32% 28%,#9dc9b1 0,#3f8777 17%,#174a45 42%,#071b20 72%);opacity:.72}
.planet-a:after{content:"";position:absolute;width:155%;height:32%;left:-27%;top:35%;border:8px solid #b6d3b077;border-left-color:#d4d8b088;border-right-color:#5e9b8b99;border-radius:50%;transform:rotate(-19deg)}
.planet-b{width:clamp(45px,11vw,95px);height:clamp(45px,11vw,95px);left:5%;top:39%;background:radial-gradient(circle at 32% 28%,#b9c9b1,#527b69 35%,#152c28 75%);opacity:.58}
.meteor{display:none;position:fixed;width:100px;height:2px;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,#ffe6a0,transparent);transform:rotate(-35deg);opacity:0;animation:shoot 8s linear infinite}
.m1{top:12%;left:-15%;animation-delay:1s}.m2{top:44%;left:-20%;animation-delay:5s}.m3{top:72%;left:-15%;animation-delay:9s}
@keyframes shoot{0%,75%{opacity:0;transform:translate(0,0) rotate(-35deg)}78%{opacity:.9}100%{opacity:0;transform:translate(125vw,65vh) rotate(-35deg)}}
.app{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100svh;padding:calc(22px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 24px}
.brand{font-weight:900;letter-spacing:3px;color:var(--gold-light);font-size:21px;text-shadow:0 0 18px #b98a35}
.pill{border:1px solid rgba(232,198,107,.35);background:rgba(3,20,13,.7);border-radius:30px;padding:8px 13px;color:#f3dfa0;font-size:12px}
.balance{text-align:center;background:linear-gradient(120deg,rgba(4,26,17,.82),rgba(30,69,43,.56));border:1px solid rgba(232,198,107,.3);border-radius:22px;padding:16px 12px;box-shadow:0 10px 35px #0006,inset 0 0 25px #d9ad3b0b;backdrop-filter:blur(8px)}
.caption{font-size:12px;color:#c8d9c8}
.arx-icon{width:44px;height:44px;object-fit:contain;vertical-align:middle;display:inline-block;filter:drop-shadow(0 0 5px #00ff8a66)}.amount{font-size:clamp(30px,8vw,38px);font-weight:900;color:#fff0b4;margin-top:4px;text-shadow:0 0 20px #d6ad52;direction:ltr}
.coin-wrap{position:relative;width:min(76vw,330px);aspect-ratio:1;margin:clamp(25px,6vh,44px) auto 20px;display:grid;place-items:center;isolation:isolate}
.coin-wrap:before{content:"";position:absolute;inset:5%;border-radius:50%;background:#00f5a02c;filter:blur(32px);z-index:-1;animation:aura 3.4s ease-in-out infinite}
.coin-wrap:after{content:"";position:absolute;inset:-2%;border:1px solid #19f5a055;border-radius:50%;box-shadow:0 0 28px #00e99b2c,inset 0 0 25px #00e99b18;z-index:-1}
.coin{position:relative;z-index:1;width:100%;height:100%;border:0;padding:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 15px #00ffa05c) drop-shadow(0 18px 24px #000b);transition:transform .12s ease;outline:none}
.coin:active{transform:scale(.95)}.coin svg,.coin img{width:100%;height:100%;object-fit:contain;display:block}.coin img{filter:drop-shadow(0 0 10px #00ffa055)}
.coin.pulse{animation:tap .27s ease}
.coin.pulse img{animation:coinGreenGlow .55s ease-out}
.coin-wrap.glow{animation:tapGlow .7s ease-out}
.float{position:absolute;left:50%;top:5%;z-index:8;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border:1px solid #39ff9a99;border-radius:24px;background:rgba(0,30,18,.94);box-shadow:0 0 18px #00ff78aa,0 0 38px #00ff7855;font-weight:950;font-size:23px;color:#8dffb7;text-shadow:0 0 10px #00ff78,0 0 22px #00ff78;animation:floatUp 1.4s ease-out forwards;white-space:nowrap}
.float img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 7px #00ff83)}.stats .arx-icon{width:44px;height:44px}
.tap-hint{text-align:center;color:#e8d89e;font-size:13px;margin:0 0 20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:90px}
.stat{background:var(--panel);border:1px solid rgba(232,198,107,.2);border-radius:17px;padding:13px;text-align:center;backdrop-filter:blur(8px)}
.stat strong{display:block;font-size:19px;color:#f7dfa0;margin-top:4px}
.energy{margin-top:16px;background:var(--panel);border:1px solid rgba(232,198,107,.18);border-radius:18px;padding:14px}
.energy-top{display:flex;justify-content:space-between;font-size:13px;color:#e9ddb2;margin-bottom:10px}
.track{height:9px;border-radius:20px;background:#152a20;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#0c9d65,#b9e57d,#f2d27b);box-shadow:0 0 12px #eac96a;transition:width .2s}
.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(3,16,11,.94);border-top:1px solid #c7a44b55;backdrop-filter:blur(18px)}
.nav button{border:0;background:transparent;color:#a9b9a8;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;font-size:10px}
.nav button.active{color:#ffe39a;text-shadow:0 0 12px #d8ad4c}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notice{text-align:center;color:#8ea08d;font-size:10px;margin-top:12px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,18px) scale(.8)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-55px) scale(1.12)}}
@keyframes tap{0%{transform:scale(1)}45%{transform:scale(.94) rotate(-1deg)}100%{transform:scale(1)}}
@keyframes coinGreenGlow{0%,100%{filter:drop-shadow(0 0 10px #00ffa055)}35%,70%{filter:drop-shadow(0 0 25px #00ff70) drop-shadow(0 0 48px #00ff70)}}
@keyframes tapGlow{0%,100%{filter:drop-shadow(0 0 0 #00ff70)}25%,65%{filter:drop-shadow(0 0 22px #00ff70) drop-shadow(0 0 48px #00ff70)}}
@keyframes glowBurst{0%,100%{opacity:.35;transform:scale(1)}35%,70%{opacity:1;transform:scale(1.22);background:#00ff7855;filter:blur(42px)}}
@keyframes aura{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.coin-wrap{width:min(72vw,285px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="space-photo"></div><div class="sparkles"></div><div class="space-planet planet-a"></div><div class="space-planet planet-b"></div>
<div class="meteor m1"></div><div class="meteor m2"></div><div class="meteor m3"></div>
<main class="app">
<header><div class="brand">AUREX <span style="color:#18d58a">◆</span></div><div class="pill">ARX · SPACE NETWORK</div></header>
<section class="balance" aria-live="polite"><div class="caption">إجمالي رصيدك</div><div class="amount"><span id="balance">0.00</span> <small style="font-size:14px;display:inline-flex;align-items:center;gap:4px"><img class="arx-icon" src="./file_000000004f0881f4bf06cf2ba2b34e38.png" alt="ARX"> ARX</small></div></section>
<div class="coin-wrap" id="coinWrap">
<button class="coin" id="tap" type="button" aria-label="اضغط على عملة AUREX لجمع المكافآت">
<img src="./file_000000004f0881f4bf06cf2ba2b34e38.png" alt="عملة AUREX ثلاثية الأبعاد">
</button>
</div>
<div class="tap-hint">اضغط على العملة واجمع مكافآت AUREX</div>
<section class="stats"><div class="stat"><span class="caption">الطاقة المتبقية</span><strong id="energyText">1000 / 1000</strong></div><div class="stat"><span class="caption">قيمة الضغطة</span><strong style="display:flex;align-items:center;justify-content:center;gap:5px">+0.01 <img class="arx-icon" src="./file_000000004f0881f4bf06cf2ba2b34e38.png" alt="ARX"></strong></div></section>
<section class="energy"><div class="energy-top"><span>⚡ الطاقة</span><span>تتجدد كل 12 ساعة</span></div><div class="track"><div class="fill" id="energyFill"></div></div></section>
<div class="notice">الرصيد والضغطات محفوظة محلياً على هذا الجهاز في هذه النسخة التجريبية</div>
</main>
<nav class="nav" aria-label="التنقل">
<button><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"/></svg><span>حسابي</span></button>
<button><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3 2.4-4.5 6-4.5M16 5a3 3 0 0 1 0 6m1 4c2.5.4 3.8 2 4 5M14 16c3.5 0 5.5 1.3 6 4"/></svg><span>دعوة</span></button>
<button class="active"><svg viewBox="0 0 24 24"><path d="M12 3 21 20H3Z"/><path d="m12 9 4 8H8Z"/></svg><span>الرئيسية</span></button>
<button><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><span>ترتيب</span></button>
<button><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-13 5h4"/></svg><span>محفظة</span></button>
</nav>
<script>
(() => {
 const reward=0.01, maxEnergy=1000;
 let balance=Number(localStorage.getItem('aurex_balance')||0);
 let taps=Number(localStorage.getItem('aurex_taps')||0);
 let energy=Number(localStorage.getItem('aurex_energy')||maxEnergy);
 const balanceEl=document.getElementById('balance'),energyEl=document.getElementById('energyText'),fill=document.getElementById('energyFill');
 const coin=document.getElementById('tap'),wrap=document.getElementById('coinWrap');
 const render=()=>{balanceEl.textContent=balance.toFixed(2);energyEl.textContent=energy+' / '+maxEnergy;fill.style.width=(energy/maxEnergy*100)+'%';};
 render();
 coin.addEventListener('click',(event)=>{
   if(energy<=0)return;
   energy--;taps++;balance=Math.round((balance+reward)*100)/100;
   localStorage.setItem('aurex_balance',balance.toFixed(2));
   localStorage.setItem('aurex_taps',String(taps));
   localStorage.setItem('aurex_energy',String(energy));render();
   coin.classList.remove('pulse');wrap.classList.remove('glow');void coin.offsetWidth;coin.classList.add('pulse');wrap.classList.add('glow');
   const rect=wrap.getBoundingClientRect(),fx=document.createElement('span');
   fx.className='float';fx.innerHTML='<span>+0.01</span><img src="./file_000000004f0881f4bf06cf2ba2b34e38.png" alt="ARX">';
   wrap.appendChild(fx);fx.addEventListener('animationend',()=>fx.remove(),{once:true});
   wrap.addEventListener('animationend',()=>wrap.classList.remove('glow'),{once:true});
 });
})();
</script>
</body></html>
